<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0055ff" />
    <meta name="description" content="Panel de Marketing Yaavs — equipo, KPIs y agenda" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yaavs" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Yaavs — Marketing</title>
    <script>
      /* Fuerza menú nuevo en todas las PCs: limpia PWA vieja una vez por build. */
      (function () {
        var BUILD = '14-formularios';
        var key = 'yaavs-app-client-version';
        var flag = 'yaavs-html-bust-' + BUILD;
        try {
          var params = new URLSearchParams(location.search);
          var force = params.get('actualizar') === '1' || params.get('update') === '1';
          if (!force && localStorage.getItem(key) === BUILD) return;
          if (!force && sessionStorage.getItem(flag) === '1') {
            localStorage.setItem(key, BUILD);
            return;
          }
          sessionStorage.setItem(flag, '1');
          localStorage.setItem(key, BUILD);
          var finish = function () {
            if (force) {
              params.delete('actualizar');
              params.delete('update');
              var q = params.toString();
              location.replace(location.pathname + (q ? '?' + q : '') + location.hash);
            } else {
              location.reload();
            }
          };
          var jobs = [];
          if (navigator.serviceWorker) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }),
            );
          }
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }),
            );
          }
          Promise.all(jobs).then(finish).catch(finish);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
